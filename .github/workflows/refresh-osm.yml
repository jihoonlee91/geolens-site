# 매월 OSM 한국 추출본(Geofabrik)으로 data/ 정적 타일을 다시 만든다.
# 원본 스크립트는 geolens-ar/tools 에 있고 여기 tools/ 는 그 사본(수정 시 함께 복사).
# 개수가 직전보다 크게 줄면(원본 이상·스크립트 오류) 올리지 않고 실패로 남긴다.
name: refresh-osm

on:
  schedule:
    - cron: "17 3 2 * *" # 매월 2일 12:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-osm
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyosmium
        run: pip install osmium==4.3.*
      - name: Download Korea extract
        run: curl -fsSL --retry 3 -o /tmp/kr.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
      - name: Keep previous counts
        run: cp data/meta.json /tmp/old-meta.json
      - name: Build tiles
        run: |
          rm -rf data/nature data/sights data/food data/trails
          python tools/build_osm_tiles.py /tmp/kr.osm.pbf data
          python tools/build_trail_tiles.py /tmp/kr.osm.pbf data
      - name: Famous peaks (100대 명산 → 새 OSM 봉우리 번호)
        run: |
          python tools/build_famous_peaks.py tools/famous_peaks.csv data | tee /tmp/famous.log
          grep -q "forest100 100, bac100 100" /tmp/famous.log || { echo "100대 명산 매칭 누락 — 이전 famous.json 유지"; git checkout -- data/collections/famous.json; }
      - name: Sanity check
        run: |
          python - <<'EOF'
          import json, sys
          old = json.load(open("/tmp/old-meta.json", encoding="utf-8")).get("counts", {})
          new = json.load(open("data/meta.json", encoding="utf-8")).get("counts", {})
          bad = [f"{k}: {old[k]} -> {new.get(k, 0)}" for k in old if isinstance(old[k], int) and old[k] > 100 and new.get(k, 0) < old[k] * 0.7]
          print("counts", new)
          if bad:
              print("Too few items, not publishing:", bad)
              sys.exit(1)
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "data: monthly OSM refresh $(date -u +%Y-%m-%d)"
          git push
